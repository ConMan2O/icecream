<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/favicon.png" type="image/png">
    <link rel="stylesheet" href="/styles/styles.css">
    <title>Ice Cream Order Form</title>

    <script src="js/ice-cream.js" defer></script>
</head>
<body>
    <h1>Ice Cream Order Form</h1>
    
    <form id="ice-cream-form" action="#" method="get">

        <fieldset>
            <legend id="fieldset-label">Personal Information</legend>
            <label for="name">Name:</label>
            <input type="text" id="inputName" name="name">
            <span class="error" id="error-name">Your Name is required</span>

            
            <label for="email">Email:</label>
            <input type="email" id="inputEmail" name="email">
            <span class="error" id="error-email">Your Email is required</span>
        </fieldset>

        <fieldset>
            <legend id="fieldset-label">Order Details</legend>
            <span class="error" id="error-flavor">Please select a flavor</span>
            <label for="flavor">Choose your flavor:</label>
            <select id="flavor" name="flavor">
                <option value="none">Select a flavor</option>
                <option value="vanilla">Vanilla</option>
                <option value="chocolate">Chocolate</option>
                <option value="strawberry">Strawberry</option>
                <option value="coffee">Coffee</option>
            </select>
        
            <legend for="cone">Choose your cone: </legend>
            <span class="error" id="error-cone">Please select a cone type</span>
            <input type="radio" id="waffle" name="cone-type" value="waffle">
            <label for="waffle"> Waffle Cone </label>
            <input type="radio" id="sugar" name="cone-type" value="sugar">
            <label for="sugar">Sugar Cone</label>
            <input type="radio" id="cup" name="cone-type" value="cup">
            <label for="cup"> Cup </label>

            <legend for="toppings">Toppings:</legend>
            <input type="checkbox" id="sprinkles" name="toppings[]" value="sprinkles">
            <label for="sprinkles">Sprinkles</label>
            <input type="checkbox" id="nuts" name="toppings[]" value="nuts">
            <label for="nuts">Nuts</label>
            <input type="checkbox" id="cherry" name="toppings[]" value="cherry">
            <label for="cherry">Cherry</label>
            <input type="checkbox" id="whipped-cream" name="toppings[]" value="whipped-cream">
            <label for="whipped-cream">Whipped Cream</label>

            <legend for="comments">Additional Comments:</legend>
            <textarea name="comments" rows="4" cols="50"></textarea>

        </fieldset>

        <button type="submit" id="order-button">Submit Order</button>


    </form>
</body>
</html>
