<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/favicon.png" type="image/png">
    <link rel="stylesheet" href="/styles/styles.css">
    <title>Ice Cream Order Form</title>
</head>
<body>
    <h1>Ice Cream Order Form</h1>
    
    <form>

        <fieldset>
            <legend id="fieldset-label">Personal Information</legend>
            <label for="name">Name:</label>
            <input type="text" name="name" required>
            <label for="email">Email:</label>
            <input type="email" name="email" required>
        </fieldset>

        <fieldset>
            <legend id="fieldset-label">Order Details</legend>
            <label for="flavor">Choose your flavor:</label>
            <select name="flavor">
            <option>Vanilla</option>
            <option>Chocolate</option>
            <option>Strawberry</option>
            <option>Coffee</option>
            </select>
        
            <legend for="cone">Choose your cone: </legend>
            <input type="radio" id="waffle" name="cone-type" value="waffle" required>
            <label for="cone"> Waffle Cone </label>
            <input type="radio" id="sugar" name="cone-type" value="sugar" required>
            <label for="cone">Sugar Cone</label>
            <input type="radio" id="cup" name="cone-type" value="cup" required>
            <label for="cone"> Cup </label>

            <legend for="toppings">Toppings:</legend>
            <input type="checkbox" id="sprinkles" name="toppings[]" value="sprinkles">
            <label for="toppings">Sprinkles</label>
            <input type="checkbox" id="nuts" name="toppings[]" value="nuts">
            <label for="toppings">Nuts</label>
            <input type="checkbox" id="cherry" name="toppings[]" value="cherry">
            <label for="toppings">Cherry</label>
            <input type="checkbox" id="whipped-cream" name="toppings[]" value="whipped-cream">
            <label for="toppings">Whipped Cream</label>

            <legend for="comments">Additional Comments:</legend>
            <textarea name="comments" rows="4" cols="50"></textarea>

        </fieldset>

        <button type="submit" id="order-button">Submit Order</button>


    </form>
</body>
</html>
